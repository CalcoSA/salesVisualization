services:
  backend:
    build:
      context: .
      target: backend
    image: callcenter-backend:prod
    restart: always
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      PORT: 3001
      APP_ENV: production
    expose:
      - "3001"

  frontend:
    build:
      context: .
      target: frontend
    image: callcenter-frontend:prod
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
